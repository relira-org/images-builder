name: Build images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (empty: today, e.g. 2026-09-26)'
        required: false
        type: string
      release:
        description: 'Publish a release (off: build only, images kept as workflow artifacts)'
        required: false
        type: boolean
        default: true
  push:
    tags: ['v*', '20*']

jobs:
  build:
    # Each arch natively on its own runner
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - amd64
        distro:
          - debian_12
          - debian_13
          - debian_14
          - ubuntu_22.04
          - ubuntu_24.04
          - ubuntu_26.04
          - rockylinux_8
          - rockylinux_9
          - rockylinux_10
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          meta=${{ matrix.distro }}/catalog.json

          arch=${{ matrix.arch }}
          name=$(jq -r --arg arch "$arch" '"\(.distro | ascii_downcase)_\(.version)_\($arch)"' "$meta")
          case "$arch:$(uname -m)" in arm64:aarch64|amd64:x86_64) ;;
            *) echo "the $arch build is on a $(uname -m) runner"; exit 1 ;; esac

          ARCH="$arch" NAME="$name" KEYS= bash build.sh ${{ matrix.distro }}

          mkdir dist
          mv out/"$name".tar.zst dist/
          jq --arg arch "$arch" --arg file "$name.tar.zst" \
             --arg sha256 "$(sha256sum dist/"$name".tar.zst | cut -d' ' -f1)" \
             --argjson size "$(stat -c %s dist/"$name".tar.zst)" \
             '. + {arch: $arch, file: $file, sha256: $sha256, size: $size}' \
             "$meta" > dist/"$name".json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distro }}_${{ matrix.arch }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          tag="${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}"
          tag="${tag:-$(date -u +%Y-%m-%d)}"
          # Order: by distro and version, each arch's next to the other; the app lists its own.
          jq -s --arg generated "$(date -u +%FT%TZ)" \
             '{schema: 2, generated: $generated, images: sort_by(.distro, (.version | tonumber), .arch)}' \
             *.json > index.json
          cat index.json
          {
            echo "Relira base images built from ${GITHUB_SHA::7}."
            echo
            echo "| Image | Arch | Download | SHA-256 |"
            echo "|---|---|---|---|"
            jq -r '.images[] | "| \(.distro) \(.version) “\(.codename)” | \(.arch) | `\(.file)` (\((.size + 1048575) / 1048576 | floor) MB) | `\(.sha256)` |"' index.json
          } > notes.md

          if gh release view "$tag"; then
            gh release delete "$tag" -y --cleanup-tag
            sleep 5
          fi

          # --latest: the app downloads from releases/latest.
          gh release create "$tag" --target "$GITHUB_SHA" --title "Images $tag" \
            --notes-file notes.md --latest index.json *.tar.zst
